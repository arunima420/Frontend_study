<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
           .form1{
            background-color:rgb(156, 188, 43);
            padding: 10px;
            width:466px;
            margin-left: 39px;
           
           }
        

    </style>
</head>
<body>

    <form class="form1" action="#" method="post">
       <label  class="labela"> <h3>Step 1 : Your details</h3></label>
        <fieldset>
            <label class="label1"><b>Name</b></label>
            <input class="input1" type="text" size="30px" placeholder="First and last name"><br><br>
            <label class="label2"><b>Email</b></label>
            <input class="input2" type="email" size="30px" placeholder="example@domain.com"><br><br>
            <label class="label3"><b>Phone</b></label>
            <input class="input3" type="tel" size="30px" placeholder="Eg: +447500000000"><br><br>
        </fieldset>
        <label  class="labelb"> <h3>Step 2 : Delivery address</h3></label>
        <fieldset>
            <label class="label4"><b>Address</b></label>
            <textarea class= "input4" name="address" id="myform"></textarea><br><br>
            <label class="label5"><b>Post Code</b></label>
            <input class="input5" type="text" size="30px"><br><br>
            <label class="label6"><b>Country</b></label>
            <input list= "list1"  name="country">
             <datalist id="list1"><option>India</option><option>Argentina</option><option>Brazil</option><option>Malasia</option><option>Portugal</option></datalist>  <br><br>
        </fieldset>
        <label  class="labelc"> <h3>Step 3 : Card details</h3></label>
        <fieldset>
            <label class="label7"><b>Card type</b></label>
            <input class="input7" type="radio" value="visa1" name="visa" >
            <img src="IMG/amez1.png" width="20"><br><br>
            

            <label class="label8"><b>Card number</b></label>
            <input class="input8" type="email" size="30px" placeholder="example@domain.com"><br><br>
            <label class="label9"><b>Security code</b></label>
            <input class="input9" type="tel" size="30px" placeholder="Eg: +447500000000"><br><br>
            <label class="label10"><b>Name on card</b></label>
            <input class="input10" type="tel" size="30px" placeholder="Eg: +447500000000"><br><br>
        </fieldset>



    </form>
    
</body>
</html>
